name: Test and scan

on:
  push:
   branches: [main]
  
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: pytest services/tasts-api/tests/test_api.py
      - run: pytest services/tasts-api/tests/test_normalizer_client.py
      - run: pytest services/title-normalizer/tests/test_invoke.py
