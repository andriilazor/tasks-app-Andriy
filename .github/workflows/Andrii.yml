name: Test and scan

on:
  push:
   branches: [main]
  
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r services/${{matrix.service}}/requirements.txt
      - run: pytest services/${{matrix.service}} | tee ${{ matrix.service }}-test-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-test-report
          path: ${{ matrix.service }}-test-report.txt


  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: 
      name: github-pages
      url: ${{steps.deployment.outputs.page.url}}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: tasks-api-3.12-bandit-report.html _site/index.html
          path: _/site
      - run: ls _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - uses: actions/deploy-pages@v5
        id: deployment

