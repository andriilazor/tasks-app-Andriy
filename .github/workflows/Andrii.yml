name: Test and Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
      - run: pip install -r services/${{matrix.service}}/requirements.txt
      - run: pytest -rA services/${{matrix.service}} > ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{matrix.service}}-${{matrix.python-version}} test report
          path: ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - run: pip install bandit
      - run: bandit -r services/${{matrix.service}} -f html -o ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html
        continue-on-error: true
      - name: Upload Bandit Report as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.service}}-${{matrix.python-version}}-bandit-report
          path: ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html

  build_images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ${{matrix.service}} services/${{matrix.service}}

  tasks_api_container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tasks-api services/tasks-api
      - run: docker run -d --rm --name tasks-api -p 5000:5000 tasks-api
      - run: |
          for i in $(seq 1 30); do curl -sf localhost:5000/health && exit 0; sleep 1; done
          docker logs tasks-api
          exit 1
      - run: |
          curl -f -X POST localhost:5000/tasks -H 'Content-Type: application/json' \
            -d '{"title": " buy milk "}'

  title_normalizer_container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t title-normalizer services/title-normalizer
      - run: docker run -d --rm --name title-normalizer -p 5001:5001 title-normalizer
      - run: |
          for i in $(seq 1 30); do curl -sf localhost:5001/health && exit 0; sleep 1; done
          docker logs title-normalizer
          exit 1
      - run: |
          curl -f -X POST localhost:5001/invoke -H 'Content-Type: application/json' \
            -d '{"title": "  buy   milk "}'

  containers_talk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tasks-api services/tasks-api
      - run: docker build -t title-normalizer services/title-normalizer
      - run: docker network create tasks-net
      - run: docker run -d --rm --name title-normalizer --network tasks-net title-normalizer
      - run: |
          docker run -d --rm --name tasks-api --network tasks-net \
            -p 5000:5000 -e NORMALIZER_URL=http://title-normalizer:5001 tasks-api
      - run: |
          for i in $(seq 1 30); do
            curl -sf localhost:5000/health && docker exec tasks-api python -c "import requests; requests.get('http://title-normalizer:5001/health').raise_for_status()" && exit 0
            sleep 1
          done
          docker logs tasks-api
          docker logs title-normalizer
          exit 1
      - run: |
          curl -f -X POST localhost:5000/tasks -H 'Content-Type: application/json' \
            -d '{"title": " buy milk "}' | tee task.json
          jq -e '.normalized == true' task.json

  deploy:
    needs: run_tests
#    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    permissions:
      pages: write # default is none so no deployment to pages allowed unsless we set it
      id-token: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: tasks-api-3.12-bandit-report
        path: _site
    - uses: actions/download-artifact@v7
      with:
        name: title-normalizer-3.12-bandit-report
        path: _site
    - run: mv _site/tasks-api-3.12-bandit-report.html _site/index.html
    - run: |
        cat > _site/index.html <<'EOF'
        <h1>Bandit reports</h1>
        <p><a href="tasks-api-3.12-bandit-report.html">tasks-api</a></p>
        <p><a href="title-normalizer-3.12-bandit-report.html">title-normalizer</a></p>
        EOF
    - uses: actions/upload-pages-artifact@v5
      with:
        path: _site/
    - uses: actions/deploy-pages@v5 # outputs page_url
      id: deployment